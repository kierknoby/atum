#!KAMAILIO
listen=udp:198.51.100.20:5060
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "rr.so"
loadmodule "sanity.so"
loadmodule "maxfwd.so"
loadmodule "dispatcher.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "vendor_extension.so"
modparam("dispatcher", "db_url", "mysql://fixture-user:fixture-password@db.invalid/kamailio")
include_file "components/routing.inc"

request_route {
    mf_process_maxfwd_header(10);
    sanity_check(1511, 7);
    record_route();
    t_on_reply("MEDIA_REPLY");
    if (is_method("BYE")) {
        route(TERMINATE_CALL);
    }
    if (is_method("CANCEL")) {
        route(CANCEL_CALL);
    }
    if (has_totag()) {
        route(EXISTING_CALL);
    }
    route(NEW_CALL);
}
