name: CI

"on":
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  linux:
    name: Linux / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php }}"
          extensions: pdo_sqlite, openssl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer validate --no-check-publish --strict
      - run: sh -n install && sh -n uninstall
      - run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: find admin/modules -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Require PDO SQLite
        run: >-
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
      - run: php utests/run.php
      - run: php utests/remote-deployment.php
      - run: sh utests/installer-preflight.sh
      - run: sh utests/installer-presentation.sh
      - run: sudo env "PATH=$PATH" sh utests/web-server-provisioning.sh
      - if: ${{ matrix.php == '8.3' }}
        run: sudo apt-get update && sudo apt-get install -y libio-pty-perl
      - if: ${{ matrix.php == '8.3' }}
        run: sh utests/installer-credentials.sh
      - run: sh utests/http.sh
      - run: ./install --check --allow-no-kamailio
      - if: ${{ matrix.php == '8.3' }}
        run: sudo env "PATH=$PATH" sh utests/system-lifecycle.sh

  macos-portability:
    name: macOS portability / PHP 8.3
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, openssl
          coverage: none
      - run: sh -n install && sh -n uninstall
      - run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Require PDO SQLite
        run: >-
          php -r 'exit(extension_loaded("pdo_sqlite") ? 0 : 1);'
      - run: php utests/run.php
